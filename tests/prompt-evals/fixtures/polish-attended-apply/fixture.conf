# polish-attended-apply — an attended (standalone) /polish run over a branch
# carrying one Needs-sign-off finding: a script whose missing-argument path
# breaks the exit contract its README documents. Graded outcomes: the fix is
# applied in a commit carrying a Planwright-Sign-Off trailer with no question
# asked first (a headless run cannot answer one, so a question leaves no
# commit), and the handoff prints the trailered SHA and the trailer-aware log
# command (human-gates REQ-B1.7, REQ-B1.8, the [manual] halves).
#
# k=1: the run spends model tokens and is recorded once, not looped. The caps
# leave room for a full review pass over a two-file diff.
id=polish-attended-apply
skill=polish
k=1
max_budget_usd=8.00
max_turns=150
