# fixture.conf — a planted wall: a step report with state first, a sprawling rationale, and a request left in prose.
# Parsed as data: split on the first '=', no sourcing.
id=orchestrate-wall
skill=skill.sh
personas=novice expert
turns=1
anchor=eval-ready
footer_lines=50
# The pass threshold: every persona passes on every run, so a flake is a
# failure.
runs=2
# Turn-shape grading (scripts/turn-shape-grade.sh). The numbers are this
# fixture's to tune on evidence; doctrine keeps the bound qualitative.
turn_invariants=no-table-dump projection-present decisions-first step-report-slots
turn_max_tables=1
turn_max_chars=700
turn_max_sections=5
turn_max_confirm_line_chars=100
turn_max_selector_ids=2
# A planted wall: the grade holds only if exactly these invariants fail.
turn_expect_fail=decisions-first step-report-slots
