# fixture.conf — a multi-phase kickoff: delta-plus-open summaries, the open-captures list at each boundary, a planted follow-up captured at birth.
# Parsed as data: split on the first '=', no sourcing.
id=kickoff-multiphase
skill=skill.sh
personas=novice expert
turns=5
anchor=eval-ready
footer_lines=50
# The pass threshold: every persona passes on every run, so a flake is a
# failure.
runs=2
# Turn-shape grading (scripts/turn-shape-grade.sh). The numbers are this
# fixture's to tune on evidence; doctrine keeps the bound qualitative.
turn_invariants=no-table-dump projection-present decisions-first no-monotonic-growth identifier-density capture-at-birth open-captures-list
turn_max_tables=1
turn_max_chars=700
turn_max_sections=5
turn_max_confirm_line_chars=100
turn_max_selector_ids=2
turn_planted_capture=readme-link
