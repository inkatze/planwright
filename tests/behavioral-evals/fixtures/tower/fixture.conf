# fixture.conf — the tower routing eval fixture. Parsed as data: split on the
# first '=', no sourcing (mirrors prompt-eval.sh).
id=tower
# The interactive program the harness drives through a TTY. Relative to the
# fixture dir; resolved to an absolute path before launch.
skill=skill.sh
# One persona per acceptance scenario (chat-only, split-screen, refusal-merge,
# escalation, walk-away) and per test-spec case set (consecutive,
# escalation-cases, overrides, kickoff-offer, orchestrate-go). grade.jq pins
# each persona's expected routes, dispatches, and refusals by name.
personas=chat-only split-screen refusal-merge escalation walk-away consecutive escalation-cases overrides kickoff-offer orchestrate-go
# The longest persona (consecutive) reads seven lines; the driver turn ceiling
# is turns+3, so 7 leaves headroom without masking a runaway.
turns=7
# The skill prints top-down with its `EVAL-READY turn=N` anchor as the last
# line; footer_lines spans the whole 50-row pane (mirrors greeter and kickoff).
anchor=eval-ready
footer_lines=50
