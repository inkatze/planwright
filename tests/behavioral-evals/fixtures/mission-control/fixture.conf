# fixture.conf — the mission control eval fixture. Parsed as data: split on the
# first '=', no sourcing.
id=mission-control
skill=skill.sh
# One persona per [Gherkin] arm of specs/mission-control/test-spec.md, each
# naming its arm in an `arm=` line; scripts/mc-eval-cadence.sh's `complete`
# fails the suite when an arm has no persona here or a persona names no arm.
personas=bring-up on-behalf no-concepts entry-args rule-entry mechanization self-check shadow duty-proposal drive-to-done push-first status-form delivery nothing-dropped picklist answerable decide-or-queue follow-up draft-clipboard first-run denial cited-source no-send relayed-kickoff succession
# The longest persona's line count; the driver turn ceiling is turns+3.
turns=15
anchor=eval-ready
footer_lines=50
