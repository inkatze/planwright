# Bake-off B: the hook tier. README.md holds the run command; the contracts
# are written in candidates/shell/lib/proto.sh. The call site is the
# tokenizer on a typical worker command, since the command guard tokenizes
# every Bash call while the ready predicate runs only on a flip.
tier=hook
runs=50
timeout_s=300
review_runs=1
call_site=tokenize/worker-compound
