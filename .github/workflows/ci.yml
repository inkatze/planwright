---
# planwright self-hosting CI (Task 2, REQ-G1.7): every guard the repo
# prescribes runs on every PR. `mise run check`, the aggregate gate
# contributors run locally, runs here split across parallel jobs, with tool
# versions pinned in mise.toml (contributor/CI parity by construction): the
# lint job runs `check:non-test` (every gate but the suite), three test jobs
# each run a third of the suite, and the `check` job joins them and judges the
# suite's timing over all three reports. The status branch protection and the
# ready-flip tooling read is `check`, so that job id must not change. The bash
# 3.2 parse step needs Docker, so it runs here only. Actions are pinned to
# full commit SHAs (supply-chain discipline per the security posture).
#
# "on" is quoted so yamllint's truthy rule (which this repo runs on
# .github/) does not flag the key.
#
# The PR-TITLE lint is deliberately NOT here — it lives in pr-title.yml, which
# fires on `edited` so a corrected title can be re-checked. Keep it there: this
# workflow's concurrency group does not vary by activity type, so a title edit
# reaching it would cancel the in-flight run testing the code.
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Claude Code CLI the lint and test jobs install; see the lint job's
# install step for why it is pinned and its floor.
env:
  CLAUDE_CODE_VERSION: 2.1.179

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The bash 3.2 parse step's image.
    env:
      BASH32_IMAGE: bash:3.2@sha256:0fd7cb8499c63a3c9345e7088a9cd83bb69f6e895e83833859aff838a0312091
    steps:
      # Full history: gitleaks scans all commits and the commit lint walks
      # the PR range.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      # mise pinned: 2026.6.3 regressed the pipx backend (it passes pip an
      # `--uploaded-prior-to` flag the runner's pip rejects, breaking the
      # yamllint install). 2026.6.1 installs the same pinned tools cleanly.
      # Revisit when a later mise fixes the pipx path.
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.6.1

      # Install the Claude Code CLI so `check:non-test`'s lint:plugin-schema
      # step ENFORCES the manifest schema (claude plugin validate) instead of
      # degrading to a skip. `claude plugin validate` is a purely local schema
      # check: it needs no authentication or API key, so no secret is wired
      # here. Pinned to an exact version (CLAUDE_CODE_VERSION above) for
      # CI/local parity, the same discipline mise.toml applies to its other
      # tools; keep the pin at or above 2.1.154 (the release that added the
      # defaultEnabled manifest field this repo sets). npm installs the
      # same native binary as the standalone installer and puts `claude` on
      # PATH; `claude --version` then fails the step loudly if the install did
      # not work, so the schema gate can never silently fall back to its skip
      # path.
      - run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version

      # Wire the tracked hook backstop before the aggregate gate verifies it:
      # the pinned wire-then-verify contract (guard-coverage REQ-A1.3, D-3).
      # check:githooks inside `check:non-test` then proves the wiring
      # decidably — an unwired runner fails loud, never a silent skip.
      # NOTE: from this step on, every git operation in the job runs under
      # the PR's githooks/ (amends and main-pushes get rejected; and
      # prepare-commit-msg is not suppressed by --no-verify). Any future
      # step that writes commits belongs before this one, or must bypass
      # deliberately.
      - run: /bin/sh scripts/wire-githooks.sh

      # Every gate in `mise run check` but the suite: shellcheck, shfmt,
      # markdownlint, yamllint, plugin-manifest JSON lint, plugin/marketplace
      # schema validation (claude plugin validate; enforced here because the
      # step above installs the Claude Code CLI on the runner), doctrine
      # link-check, the machine-local [[name]] memory-link guard over spec
      # files (REQ-D1.1), the options-reference drift check (REQ-K1.8), the
      # tasks.md ledger structural-corruption + duplicate-Status guards
      # (REQ-E1.1, REQ-E1.2), the hook-registration guard over hooks.json and
      # its payload fixtures (REQ-H1.1, REQ-H1.2), the spec validator
      # (enforced, REQ-A2.1), and the full-history gitleaks scan. lint:commits
      # inside it covers local runs; the strict PR-range lint is the dedicated
      # step below.
      - run: mise run check:non-test

      # macOS ships bash 3.2 as /bin/bash and /bin/sh, and its parser rejects
      # constructs every later bash accepts, so every tracked shell file
      # outside tests/fixtures/bash32/ is parsed in its declared dialect under
      # the real 3.2 from Docker's official image, pinned by digest
      # (tests/test-check-bash32.sh checks the pin). The same test then runs
      # under that parser, its misparse fixtures proving the step can fail.
      # git stays outside the container, which has none; the checkout is
      # mounted read-only with no network. It runs even when the gate above
      # failed, so one push reports both, and the test runs even when the
      # parse failed: each status is kept and the step fails if either did.
      # `shell: bash` is what sets pipefail, so a failed `git ls-files` fails
      # the parse instead of feeding it a short list.
      - if: ${{ !cancelled() }}
        shell: bash
        run: |
          parse_rc=0
          test_rc=0
          git -c core.quotepath=off ls-files \
            | docker run --rm -i --network none -v "$PWD:/src:ro" -w /src "$BASH32_IMAGE" \
              bash scripts/check-bash32.sh parse --files-from - --expect-version 3.2 \
            || parse_rc=$?
          docker run --rm --network none -v "$PWD:/src:ro" -w /src \
            -e PLANWRIGHT_TEST_REQUIRE_BASH32=1 "$BASH32_IMAGE" \
            bash tests/test-check-bash32.sh \
            || test_rc=$?
          [ "$parse_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]

      # Conventional-commit lint over exactly the PR's commits. The local task
      # skips quietly when there is nothing ahead of origin/main; on a PR an
      # empty or malformed range must fail instead.
      #
      # Neither length NOR format is ENFORCED per-commit: the framework never
      # rewrites history, so a violation in either would be permanently
      # unfixable and the pull request permanently red. Both are reported here
      # and enforced where the subject is still editable — githooks/commit-msg
      # at write time, and the PR title in pr-title.yml, which is the
      # squash-merge subject and therefore the only one that reaches main.
      # base_ref is the target branch, passed via env per script-injection
      # hardening practice.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: /bin/bash scripts/check-commit-msgs.sh "origin/${BASE_REF}..HEAD"

      # Screen the same PR range for purged identifiers, the content half of
      # the commit-message vector (guard-coverage REQ-B1.1, D-5). githooks/
      # already screens at write time, but only in a wired clone: this step is
      # what covers an unwired clone, a --no-verify commit, and a fork PR whose
      # author never wired anything. A match reports its location only, so the
      # identifier never lands in this log. base_ref is passed via env per
      # script-injection hardening practice, as the step above does.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: /bin/sh scripts/check-purged-identifiers.sh --commit-range "origin/${BASE_REF}..HEAD"

  # The suite in three shards (scripts/run-tests.sh --shard), split by the
  # committed duration table so each runs about a third of the suite's time.
  # Each shard prepares the runner exactly as the lint job does, so a
  # tool-gated case runs rather than skipping, and uploads its timing report
  # for the `check` job. The matrix list is the shard count's one home: each
  # job reads it as strategy.job-total.
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Full history, for the tests that check fixture provenance.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      # Pin rationale: see the lint job.
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.6.1

      - run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version

      - run: /bin/sh scripts/wire-githooks.sh

      # The report goes outside the checkout: the runner's default path is a
      # dotfile, which upload-artifact skips.
      - env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          PLANWRIGHT_TEST_TIMING_REPORT: ${{ runner.temp }}/timing-report.tsv
        run: mise run test -- --shard "$SHARD/$SHARDS"

      # Uploaded for a failing shard too, for the log; `overwrite` lets a
      # re-run of the job replace its earlier report.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: timing-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/timing-report.tsv
          overwrite: true

  # The aggregate status. It always runs, so a failed, skipped, or cancelled
  # job above fails it rather than leaving it skipped, which branch protection
  # reads as passing; under `!cancelled()` a run cancelled while this job
  # waited would skip it. Then it runs the timing gate
  # (`check:test-time` in `mise run check`) over every shard's report at once:
  # the gate needs one row per test file, which only the union holds.
  check:
    needs: [lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT_RESULT; test: $TEST_RESULT"
          [ "$LINT_RESULT" = success ] && [ "$TEST_RESULT" = success ]

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: timing-report-*
          path: ${{ runner.temp }}/timing

      - run: |
          set --
          for r in "$RUNNER_TEMP"/timing/timing-report-*/timing-report.tsv; do
            set -- "$@" --report "$r"
          done
          /bin/bash scripts/check-test-time.sh "$@"

  # The macOS userland the scripts actually run on for most operators: its
  # /usr/bin/awk is one-true-awk, which rejects a newline inside a -v value
  # where the ubuntu runner's awk accepts it, so that class of bug passes the
  # check job and breaks every Mac. Deliberately narrow (the awk-sensitive
  # suites, no mise, no tool installs) until the full suite is green under the
  # macOS /bin/bash; REQUIRE_BSD_AWK makes a runner image without that awk fail
  # instead of skipping green.
  macos-awk:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - env:
          PLANWRIGHT_TEST_REQUIRE_BSD_AWK: "1"
        run: |
          /usr/bin/awk --version
          /bin/sh tests/test-bsd-awk-multiline.sh
          /bin/sh tests/test-spec-validate.sh
          /bin/bash tests/test-spec-parse-corpus.sh

  # The full shell suite on the two platforms the matrix adds beside Ubuntu,
  # held to this branch until the suite is green on both: a platform joins
  # the pull-request workflow only once it passes there, and the filter's
  # removal is that join. Both run it as `mise run test` with the pinned dev
  # toolchain, as the check job does, so a tool-gated case runs rather than
  # skipping. Full history, for the tests that check fixture provenance.
  #
  # The macOS run narrows PATH to the system directories, so the suite meets
  # the system bash 3.2 and the BSD awk and sed rather than the GNU tools the
  # runner image layers on top; gh, mise, and node (for markdownlint-cli2)
  # are linked into a directory of their own instead of exposing Homebrew's.
  macos-suite:
    if: github.head_ref == 'planwright/universal-binary/task-4'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.6.1
      - run: |
          allow="$RUNNER_TEMP/allow-bin"
          mkdir -p "$allow"
          ln -s "$(command -v gh)" "$(command -v node)" "$(command -v mise)" "$allow/"
      - run: |
          allow="$RUNNER_TEMP/allow-bin"
          mise_bin=$(command -v mise)
          PATH="$allow:/usr/bin:/bin:/usr/sbin:/sbin"
          /bin/bash --version
          /usr/bin/awk --version
          "$mise_bin" run test

  # musl, dash as /bin/sh, and busybox for every other tool, in a stock
  # Alpine container pinned by digest, with an init so orphaned fixtures are
  # reaped as they are on a real host. Only the suite's own needs are added:
  # bash for the runner, git, jq, perl for the purged-identifier screen, and
  # the pinned mise (checksummed) with node and pipx for the npm and pipx
  # tools it installs; no GNU userland, so awk, sed and the rest stay busybox.
  # The suite runs as an unprivileged user, since root passes the permission
  # checks several tests rely on failing.
  alpine-suite:
    if: github.head_ref == 'planwright/universal-binary/task-4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      options: --init
    env:
      MISE_VERSION: v2026.6.1
      MISE_SHA256: f37f4be1f22e5f81d2bbdcdbf239a48f002acd345e001b07dddd3431fd808b60
    steps:
      - run: apk add --no-cache bash git jq dash-binsh perl nodejs npm pipx
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - run: |
          test "$(readlink -f /bin/sh)" = /usr/bin/dash
          test "$(readlink -f "$(command -v awk)")" = /bin/busybox
          test "$(readlink -f "$(command -v sed)")" = /bin/busybox
          wget -q -O /usr/local/bin/mise \
            "https://github.com/jdx/mise/releases/download/$MISE_VERSION/mise-$MISE_VERSION-linux-x64-musl"
          printf '%s  %s\n' "$MISE_SHA256" /usr/local/bin/mise | sha256sum -c -
          chmod 755 /usr/local/bin/mise
          adduser -D suite
          chown -R suite "$GITHUB_WORKSPACE"
          su suite -c 'mise trust -q . && mise install && mise run test'
