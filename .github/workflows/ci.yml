---
# planwright self-hosting CI (Task 2, REQ-G1.7): every guard the repo
# prescribes runs on every PR. `mise run check`, the aggregate gate
# contributors run locally, runs here split across parallel jobs, with tool
# versions pinned in mise.toml (contributor/CI parity by construction): the
# lint job runs `check:non-test` (every gate but the suite), the plan job
# picks how many shards the suite needs, one test job runs each shard, the
# macOS and Alpine jobs run the suite in shards of their own, and the `check`
# job joins them all and judges the suite's timing over every Linux shard's
# report. The status branch protection and the
# ready-flip tooling read is `check`, so that job id must not change. The bash
# 3.2 parse step needs Docker, so it runs here only. Actions are pinned to
# full commit SHAs (supply-chain discipline per the security posture).
#
# "on" is quoted so yamllint's truthy rule (which this repo runs on
# .github/) does not flag the key.
#
# The PR-TITLE lint is deliberately NOT here — it lives in pr-title.yml, which
# fires on `edited` so a corrected title can be re-checked. Keep it there: this
# workflow's concurrency group does not vary by activity type, so a title edit
# reaching it would cancel the in-flight run testing the code.
name: ci

"on":
  # `ready_for_review` and `labeled` start the macOS jobs on a head a draft
  # push skipped them for (see the plan job's mac step).
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Claude Code CLI the lint and test jobs install; see the lint job's
# install step for why it is pinned and its floor.
env:
  CLAUDE_CODE_VERSION: 2.1.310

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    # The bash 3.2 parse step's image.
    env:
      BASH32_IMAGE: bash:3.2@sha256:0fd7cb8499c63a3c9345e7088a9cd83bb69f6e895e83833859aff838a0312091
    steps:
      # Full history: gitleaks scans all commits and the commit lint walks
      # the PR range.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      # mise pinned: 2026.6.3 regressed the pipx backend (it passes pip an
      # `--uploaded-prior-to` flag the runner's pip rejects, breaking the
      # yamllint install). 2026.6.1 installs the same pinned tools cleanly.
      # Revisit when a later mise fixes the pipx path.
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.6.1

      # Install the Claude Code CLI so `check:non-test`'s lint:plugin-schema
      # step ENFORCES the manifest schema (claude plugin validate), and its
      # check:panel-mod step runs the panel mod's plugin tests, instead of
      # each degrading to a skip. `claude plugin validate` is a purely local schema
      # check: it needs no authentication or API key, so no secret is wired
      # here. Pinned to an exact version (CLAUDE_CODE_VERSION above) for
      # CI/local parity, the same discipline mise.toml applies to its other
      # tools; keep the pin at or above the mods floor
      # scripts/check-panel-mod.sh holds, below which the panel mod's plugin
      # tests fail the gate rather than run. npm installs the
      # same native binary as the standalone installer and puts `claude` on
      # PATH; `claude --version` then fails the step loudly if the install did
      # not work, so the schema gate can never silently fall back to its skip
      # path.
      - run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version

      # The Ubuntu leg of the install smoke the macOS and Alpine jobs below
      # also run; here because this job already carries the Claude CLI its
      # marketplace mode installs through.
      - name: install smoke
        run: /bin/sh scripts/install-smoke.sh

      # Wire the tracked hook backstop before the aggregate gate verifies it:
      # the pinned wire-then-verify contract (guard-coverage REQ-A1.3, D-3).
      # check:githooks inside `check:non-test` then proves the wiring
      # decidably — an unwired runner fails loud, never a silent skip.
      # NOTE: from this step on, every git operation in the job runs under
      # the PR's githooks/ (amends and main-pushes get rejected; and
      # prepare-commit-msg is not suppressed by --no-verify). Any future
      # step that writes commits belongs before this one, or must bypass
      # deliberately.
      - run: /bin/sh scripts/wire-githooks.sh

      # Every gate in `mise run check` but the suite: shellcheck, shfmt,
      # markdownlint, yamllint, plugin-manifest JSON lint, plugin/marketplace
      # schema validation (claude plugin validate; enforced here because the
      # step above installs the Claude Code CLI on the runner), doctrine
      # link-check, the machine-local [[name]] memory-link guard over spec
      # files (REQ-D1.1), the options-reference drift check (REQ-K1.8), the
      # tasks.md ledger structural-corruption + duplicate-Status guards
      # (REQ-E1.1, REQ-E1.2), the hook-registration guard over hooks.json and
      # its payload fixtures (REQ-H1.1, REQ-H1.2), the spec validator
      # (enforced, REQ-A2.1), and the full-history gitleaks scan. lint:commits
      # inside it covers local runs; the strict PR-range lint is the dedicated
      # step below.
      - run: mise run check:non-test

      # macOS ships bash 3.2 as /bin/bash and /bin/sh, and its parser rejects
      # constructs every later bash accepts, so every tracked shell file
      # outside tests/fixtures/bash32/ is parsed in its declared dialect under
      # the real 3.2 from Docker's official image, pinned by digest
      # (tests/test-check-bash32.sh checks the pin). The same test then runs
      # under that parser, its misparse fixtures proving the step can fail.
      # git stays outside the container, which has none; the checkout is
      # mounted read-only with no network. It runs even when the gate above
      # failed, so one push reports both, and the test runs even when the
      # parse failed: each status is kept and the step fails if either did.
      # `shell: bash` is what sets pipefail, so a failed `git ls-files` fails
      # the parse instead of feeding it a short list.
      - if: ${{ !cancelled() }}
        shell: bash
        run: |
          parse_rc=0
          test_rc=0
          git -c core.quotepath=off ls-files \
            | docker run --rm -i --network none -v "$PWD:/src:ro" -w /src "$BASH32_IMAGE" \
              bash scripts/check-bash32.sh parse --files-from - --expect-version 3.2 \
            || parse_rc=$?
          docker run --rm --network none -v "$PWD:/src:ro" -w /src \
            -e PLANWRIGHT_TEST_REQUIRE_BASH32=1 "$BASH32_IMAGE" \
            bash tests/test-check-bash32.sh \
            || test_rc=$?
          [ "$parse_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]

      # Conventional-commit lint over exactly the PR's commits. The local task
      # skips quietly when there is nothing ahead of origin/main; on a PR an
      # empty or malformed range must fail instead.
      #
      # Neither length NOR format is ENFORCED per-commit: the framework never
      # rewrites history, so a violation in either would be permanently
      # unfixable and the pull request permanently red. Both are reported here
      # and enforced where the subject is still editable — githooks/commit-msg
      # at write time, and the PR title in pr-title.yml, which is the
      # squash-merge subject and therefore the only one that reaches main.
      # base_ref is the target branch, passed via env per script-injection
      # hardening practice.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: /bin/bash scripts/check-commit-msgs.sh "origin/${BASE_REF}..HEAD"

      # Screen the same PR range for purged identifiers, the content half of
      # the commit-message vector (guard-coverage REQ-B1.1, D-5). githooks/
      # already screens at write time, but only in a wired clone: this step is
      # what covers an unwired clone, a --no-verify commit, and a fork PR whose
      # author never wired anything. A match reports its location only, so the
      # identifier never lands in this log. base_ref is passed via env per
      # script-injection hardening practice, as the step above does.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: /bin/sh scripts/check-purged-identifiers.sh --commit-range "origin/${BASE_REF}..HEAD"

      # A PR titled with the `comments` scope declares itself comment-only, so
      # its surface files must keep every code line the base has. The title is
      # fetched live, never read from the event payload: this workflow does not
      # fire on `edited`, so only a live read lets a rerun see a corrected title.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .title)
          if printf '%s\n' "$title" | grep -Eq '^[a-z]+\(comments\)!?: '; then
            /bin/sh scripts/check-comment-budget.sh --code-invariant "origin/${BASE_REF}"
          else
            echo "not a comments-scoped PR; the code-invariance check does not apply"
          fi

  # The shard count, from the suite time the committed duration table
  # predicts over shard_target_seconds in config/test-time-budget.yml
  # (scripts/run-tests.sh --plan-shards), so the count grows with the suite
  # and a shard's wall-clock stays near the target. It runs on the shards'
  # runner type, since the prediction divides by this machine's cores, and
  # needs no toolchain: the planner reads two files and runs nothing.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      mac_run: ${{ steps.mac.outputs.run }}
      mac_runner: ${{ steps.mac.outputs.runner }}
      mac_shards: ${{ steps.mac.outputs.shards }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - id: plan
        run: |
          shards=$(/bin/bash scripts/run-tests.sh --plan-shards)
          echo "shards=$shards" >>"$GITHUB_OUTPUT"

      # Where the macOS jobs run (docs/ci-self-hosted-mac.md). The offload
      # Mac's self-hosted runner takes them only when the repository variable
      # switches it on AND the code is this repository's own: a push here, or
      # a pull request whose head branch lives here. Anything else, a fork's
      # pull request above all, gets GitHub's hosted macOS, the reason in the
      # run summary. The workflow cannot stop a fork's edited copy of itself
      # from naming the runner's labels; the runner's job-started hook is what
      # refuses that. Both paths run four shards, so no one job has to fit
      # the whole suite inside its timeout.
      #
      # Whether they run at all is decided first (macOS runners are scarce, and
      # draft pushes queued behind each other and main): a push to main, and a
      # pull request that is not a draft, run them; a draft runs them only
      # while it carries the `ci-macos` label, the label the ready-flip
      # readiness check names when a head's macOS jobs were skipped. The Linux
      # jobs run on every push regardless. Both macOS jobs carry
      # `if: needs.plan.outputs.mac_run == 'true'`, the one job-level condition
      # check:workflow-posture accepts on them, and the check job below
      # accepts their skip only when that output is not true.
      - id: mac
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci-macos') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SWITCH: ${{ vars.PLANWRIGHT_MAC_RUNNER }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ] && [ "$LABELLED" != true ]; then
            run=false
          fi
          runner=hosted
          if [ "$SWITCH" != self-hosted ]; then
            reason="the PLANWRIGHT_MAC_RUNNER variable is not set to self-hosted"
          elif [ "$EVENT" = push ]; then
            runner=self-hosted
            reason="a push to $GITHUB_REPOSITORY"
          elif [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            runner=self-hosted
            reason="a pull request from a branch of $GITHUB_REPOSITORY"
          else
            reason="a $EVENT from '$HEAD_REPO', not $GITHUB_REPOSITORY, stays on hosted macOS"
          fi
          shards='[1, 2, 3, 4]'
          if [ "$run" = true ]; then
            msg="macOS jobs: $runner runner, $shards shards ($reason)"
          else
            msg="macOS jobs: skipped on a draft; label it ci-macos or mark it ready"
          fi
          echo "$msg"
          echo "$msg" >>"$GITHUB_STEP_SUMMARY"
          { echo "run=$run"; echo "runner=$runner"; echo "shards=$shards"; } >>"$GITHUB_OUTPUT"

  # The suite in the planned shards (scripts/run-tests.sh --shard), split by
  # the same table so each runs about an equal share of the suite's time.
  # Each shard prepares the runner exactly as the lint job does, so a
  # tool-gated case runs rather than skipping, and uploads its timing report
  # for the `check` job. Each job reads the count as strategy.job-total.
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # Full history, for the tests that check fixture provenance.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      # Pin rationale: see the lint job.
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.6.1

      - run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version

      - run: /bin/sh scripts/wire-githooks.sh

      # The report goes outside the checkout: the runner's default path is a
      # dotfile, which upload-artifact skips.
      - env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          PLANWRIGHT_TEST_TIMING_REPORT: ${{ runner.temp }}/timing-report.tsv
        run: mise run test -- --shard "$SHARD/$SHARDS"

      # Uploaded for a failing shard too, for the log; `overwrite` lets a
      # re-run of the job replace its earlier report.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: timing-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/timing-report.tsv
          overwrite: true

  # The aggregate status, joining every job on every platform. It always runs,
  # so a failed, skipped, or cancelled job above fails it rather than leaving
  # it skipped, which branch protection reads as passing; under `!cancelled()`
  # a run cancelled while this job waited would skip it. A matrix job's result
  # is success only when every one of its shards succeeded, and a failed plan
  # skips every planned shard, which fails it too. Then it runs the timing
  # gate (`check:test-time` in `mise run check`) over every Linux shard's
  # report at once: the gate needs one row per test file, which only the union
  # holds, and its budgets are the Ubuntu runner's.
  check:
    needs: [lint, plan, test, macos-suite, macos-smoke, alpine-suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          LINT_RESULT: ${{ needs.lint.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MAC_RUN: ${{ needs.plan.outputs.mac_run }}
          MACOS_RESULT: ${{ needs.macos-suite.result }}
          MACOS_SMOKE_RESULT: ${{ needs.macos-smoke.result }}
          ALPINE_RESULT: ${{ needs.alpine-suite.result }}
        run: |
          echo "lint: $LINT_RESULT; plan: $PLAN_RESULT; test: $TEST_RESULT"
          echo "mac_run: $MAC_RUN; macos-suite: $MACOS_RESULT; macos-smoke: $MACOS_SMOKE_RESULT"
          echo "alpine-suite: $ALPINE_RESULT"
          # A macOS job is skipped only on a draft run that planned no macOS;
          # the ready-flip readiness check still wants them green on the head.
          if [ "$MAC_RUN" = false ] && [ "$MACOS_RESULT" = skipped ] \
            && [ "$MACOS_SMOKE_RESULT" = skipped ]; then
            MACOS_RESULT=success
            MACOS_SMOKE_RESULT=success
          fi
          [ "$LINT_RESULT" = success ] && [ "$PLAN_RESULT" = success ] \
            && [ "$TEST_RESULT" = success ] && [ "$MACOS_RESULT" = success ] \
            && [ "$MACOS_SMOKE_RESULT" = success ] && [ "$ALPINE_RESULT" = success ]

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: timing-report-*
          path: ${{ runner.temp }}/timing

      - run: |
          set --
          for r in "$RUNNER_TEMP"/timing/timing-report-*/timing-report.tsv; do
            set -- "$@" --report "$r"
          done
          /bin/bash scripts/check-test-time.sh "$@"

  # The two platforms the matrix adds beside the Ubuntu jobs above, each
  # joined by `check`: the full shell suite and the install smoke on macOS
  # (the system bash 3.2 and the BSD awk and sed) and on Alpine (musl, dash
  # as /bin/sh, busybox). Both run the suite in shards (scripts/run-tests.sh
  # --shard) as `mise run test` with the pinned dev toolchain, as the test
  # shard jobs do, so a tool-gated case runs rather than skipping. Full
  # history, for the tests that check fixture provenance. The install smoke
  # (scripts/install-smoke.sh) installs planwright through the writer and the
  # Claude CLI's marketplace flow and runs scripts/step-record.sh, the
  # adopter-tier script with the largest coupling profile in the partition,
  # with PATH narrowed to an allowlist of a POSIX shell's utilities, git, and
  # gh; it runs on Ubuntu in the lint job. check:workflow-posture holds these
  # jobs to the matrix: present, never gated on a platform, every step
  # blocking, and the Alpine steps to its scope.
  #
  # The macOS jobs narrow PATH to the system directories, so they meet the
  # system bash 3.2 and the BSD awk and sed rather than the GNU tools the
  # runner image layers on top; gh, mise, node (for markdownlint-cli2), and the
  # Claude CLI are linked into a directory of their own instead of exposing
  # Homebrew's. REQUIRE_BSD_AWK makes a runner image without that awk fail
  # instead of skipping green.
  macos-suite:
    name: macos-suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    # The runner is the plan job's `mac` step's choice (the offload Mac's
    # runners carry the label offload-mac-ci); both kinds run four shards.
    # check:workflow-posture accepts exactly this runs-on shape as a
    # macOS job; keep it identical in macos-smoke.
    needs: plan
    if: ${{ needs.plan.outputs.mac_run == 'true' }}
    # yamllint disable-line rule:line-length
    runs-on: ${{ needs.plan.outputs.mac_runner == 'self-hosted' && fromJSON('["self-hosted", "macOS", "ARM64", "offload-mac-ci"]') || 'macos-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.mac_shards) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.6.1
      - run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version
      - run: |
          allow="$RUNNER_TEMP/allow-bin"
          mkdir -p "$allow"
          ln -s "$(command -v gh)" "$(command -v node)" "$(command -v mise)" \
            "$(command -v claude)" "$allow/"
      - name: shell suite
        env:
          PLANWRIGHT_TEST_REQUIRE_BSD_AWK: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          allow="$RUNNER_TEMP/allow-bin"
          mise_bin=$(command -v mise)
          PATH="$allow:/usr/bin:/bin:/usr/sbin:/sbin"
          /bin/bash --version
          /usr/bin/awk --version
          "$mise_bin" run test -- --shard "$SHARD/$SHARDS"

  macos-smoke:
    needs: plan
    if: ${{ needs.plan.outputs.mac_run == 'true' }}
    # yamllint disable-line rule:line-length
    runs-on: ${{ needs.plan.outputs.mac_runner == 'self-hosted' && fromJSON('["self-hosted", "macOS", "ARM64", "offload-mac-ci"]') || 'macos-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.6.1
      - run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version
      - run: |
          allow="$RUNNER_TEMP/allow-bin"
          mkdir -p "$allow"
          ln -s "$(command -v gh)" "$(command -v node)" "$(command -v mise)" \
            "$(command -v claude)" "$allow/"
      - name: install smoke
        run: |
          PATH="$RUNNER_TEMP/allow-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          /bin/sh scripts/install-smoke.sh

  # musl, dash as /bin/sh, and busybox for every other tool, in a stock
  # Alpine container pinned by digest, with an init so orphaned fixtures are
  # reaped as they are on a real host. Only the suite's own needs are added:
  # bash for the runner, git, jq, perl for the purged-identifier screen, and
  # the pinned mise (checksummed) with node and pipx for the npm and pipx
  # tools it installs; no GNU userland, so awk, sed and the rest stay busybox
  # (GNU tar, which the toolchain cache needs, is removed before the suite runs).
  # The suite runs as an unprivileged user, since root passes the permission
  # checks several tests rely on failing.
  #
  # The job's scope is the shell suite, the install smoke, and (once it exists)
  # the bake-off harness, each a step of that name; other steps are `setup:
  # <what>`. Those need a tool without a musl build, Docker, or the Claude
  # CLI's plugin schema check, so they run on Ubuntu only, in the lint job:
  # `mise run check:non-test`, the bash 3.2 parse step, the PR-range commit
  # lint, and the purged-identifier screen; the timing gate runs in the check
  # job. The install smoke's marketplace mode needs the Claude CLI, added after
  # the suite runs.
  #
  # The suite runs in the planned shards, since this runner type is the one
  # the plan job measures. Every shard also runs the install smoke: the
  # posture guard holds the Alpine scope to a single job (universal-binary
  # REQ-B1.4), so the smoke cannot move to a job of its own as on macOS.
  alpine-suite:
    name: alpine-suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    container:
      image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
      options: --init
    env:
      MISE_VERSION: v2026.6.1
      MISE_SHA256: f37f4be1f22e5f81d2bbdcdbf239a48f002acd345e001b07dddd3431fd808b60
    steps:
      # GNU tar is here only for actions/cache, which busybox tar cannot
      # serve; it is removed again before the suite runs.
      - name: "setup: packages"
        run: apk add --no-cache bash git jq dash-binsh perl nodejs npm pipx tar
      - name: "setup: checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      # The npm and pipx tools mise installs run on the image's node and
      # python, so their versions are part of the cache key.
      - name: "setup: platform and the suite user"
        id: platform
        run: |
          test "$(readlink -f /bin/sh)" = /usr/bin/dash
          test "$(readlink -f "$(command -v awk)")" = /bin/busybox
          test "$(readlink -f "$(command -v sed)")" = /bin/busybox
          adduser -D suite
          digest=$(cat /etc/alpine-release mise.toml && node --version && python3 --version)
          digest=$(printf '%s\n' "$digest" | sha256sum | cut -c1-16)
          echo "cache-key=alpine-mise-$MISE_VERSION-$digest" >> "$GITHUB_OUTPUT"
      - name: "setup: restore mise and its tools"
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/bin/mise
            /home/suite/.local/share/mise
          key: ${{ steps.platform.outputs.cache-key }}
      # A restored mise is checksummed like a downloaded one. The retries ride
      # out github.com release downloads failing for minutes at a time.
      - name: "setup: mise and its tools"
        run: |
          retry() {
            for pause in 15 45 90; do
              "$@" && return 0
              echo "retrying in ${pause}s: $*" >&2
              sleep "$pause"
            done
            "$@"
          }
          if [ ! -f /usr/local/bin/mise ]; then
            retry wget -q -T 60 -O /usr/local/bin/mise \
              "https://github.com/jdx/mise/releases/download/$MISE_VERSION/mise-$MISE_VERSION-linux-x64-musl"
          fi
          printf '%s  %s\n' "$MISE_SHA256" /usr/local/bin/mise | sha256sum -c -
          chmod 755 /usr/local/bin/mise
          chown -R suite "$GITHUB_WORKSPACE" /home/suite
          su suite -c 'mise trust -q .'
          retry su suite -c 'mise install'
      - name: "setup: save mise and its tools"
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/bin/mise
            /home/suite/.local/share/mise
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: "setup: busybox tar"
        run: |
          apk del tar
          test "$(readlink -f "$(command -v tar)")" = /bin/busybox
      - name: shell suite
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: su suite -c "mise run test -- --shard $SHARD/$SHARDS"
      - name: "setup: the Claude CLI"
        run: |
          apk add --no-cache libgcc libstdc++
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version
      - name: install smoke
        run: su suite -c '/bin/sh scripts/install-smoke.sh'
