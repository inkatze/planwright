# planwright repo-tracked config overlay (team-shared, committed).
#
# This is the repo-tracked layer of the four-layer config overlay (core
# defaults < adopter < repo-tracked < machine-local), read by
# scripts/config-get.sh via scripts/resolve-overlay-root.sh. It holds the
# values that are this repo's policy of record, overriding the core defaults in
# config/defaults.yml. Keep it flat `key: value` YAML — the reader is a
# line-oriented flat reader, and a nested structure hard-fails this shared layer
# (config-get exit 4).
#
# Machine-local and personal overrides do NOT belong here; they go in the
# gitignored .claude/planwright.local.yml (machine-local layer).

# Release-tag signing is REQUIRED on this repo (autopilot-reflex D-4, REQ-D1.4).
# scripts/release-publish.sh refuses to cut a tag unless git signing is
# configured and the signature succeeds; the signed tag is verified with
# `git tag -v` before push (REQ-D1.5). Signing is delegated entirely to this
# repo's git config (gpg.format / user.signingkey / gpg.ssh.program) — no signer
# is named and no signing material ever enters CI. planwright's live v0.2.x tags
# are already SSH-signed annotated tags; this makes that practice enforced, not
# incidental. See doctrine/release-tagging.md and docs/getting-started.md
# ("Releasing planwright").
require_signed_tags: require

# The Claude-side convergence pass for every unit: the convergence point's
# step list (doctrine/custom-steps.md). The panel pass stays a tower-level step
# per unit until it is declared as a step in an overlay catalog.
steps_convergence: [self-review]

# Transitional, added 2026-09-28: this repository's units run the INSTALLED
# plugin, whose convergence still reads the retired knob below until the
# release carrying custom-steps Task 3 is installed here. Removed under the
# custom-steps Deferred entry "Dropping the transitional `review_sequence`
# line"; the step resolver ignores it and warns naming this layer.
review_sequence: [self-review]

# Pinned, not inherited: the convergence steps above depend on it. `per-step`
# runs implementation and EACH convergence step in its own fresh
# /resume-seeded session, so each review's perspective is uncontaminated by
# the prior step's context. This currently matches the core default, but
# config/defaults.yml tracks flipping that default as risk row R3, so this repo
# states it explicitly rather than inheriting it.
dispatch_isolation: per-step

# The reachable-closure budget, raised by the measured size of
# doctrine/tower-comms.md (tower-comms D-13, REQ-I1.3): the tower closures sit
# at the margins their declared exceptions pin them to, and that ratchet fails
# closed on any further point-of-use load, so the conversation rule doc could
# not land as a point-of-use read without this. The rationale, and why the rungs below a
# raise did not apply, is the matching `raise|` line in
# config/instruction-budget-exemptions.txt; the guard fails closed if the two
# values disagree. Floor knobs are untouched. Raised again by the measured
# size of doctrine/custom-steps.md, the rule doc /execute-task reads at each
# custom-steps point (custom-steps kickoff brief risk 17); the same `raise|`
# line records why.
instruction_budget_closure_error: 23967
