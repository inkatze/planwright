# planwright repo-tracked config overlay (team-shared, committed).
#
# This is the repo-tracked layer of the four-layer config overlay (core
# defaults < adopter < repo-tracked < machine-local), read by
# scripts/config-get.sh via scripts/resolve-overlay-root.sh. It holds the
# values that are this repo's policy of record, overriding the core defaults in
# config/defaults.yml. Keep it flat `key: value` YAML — the reader is a
# line-oriented flat reader, and a nested structure hard-fails this shared layer
# (config-get exit 4).
#
# Machine-local and personal overrides do NOT belong here; they go in the
# gitignored .claude/planwright.local.yml (machine-local layer).

# Release-tag signing is REQUIRED on this repo (autopilot-reflex D-4, REQ-D1.4).
# scripts/release-publish.sh refuses to cut a tag unless git signing is
# configured and the signature succeeds; the signed tag is verified with
# `git tag -v` before push (REQ-D1.5). Signing is delegated entirely to this
# repo's git config (gpg.format / user.signingkey / gpg.ssh.program) — no signer
# is named and no signing material ever enters CI. planwright's live v0.2.x tags
# are already SSH-signed annotated tags; this makes that practice enforced, not
# incidental. See doctrine/release-tagging.md and docs/getting-started.md
# ("Releasing planwright").
require_signed_tags: require

# The Claude-side convergence pass for every unit.
#
# NOTE on what is deliberately NOT here: the intended sequence is
# [self-review, panel-review] — a Claude pass followed by a non-Anthropic panel
# pass, so convergence variance does not come exclusively from the active Claude
# session. That value is NOT expressible today. scripts/resolve-review-sequence.sh
# admits a name only when <planwright-skills-root>/<name>/SKILL.md exists and its
# `argument-hint:` declares --nested, so the nestable set is {polish,
# self-review} — planwright's own skills. /panel-review is a dotfiles-local slash
# command, not a planwright skill, so it can never satisfy that predicate, and a
# malformed value in this repo-tracked layer HARD-FAILS (exit 4) rather than
# degrading. Until planwright can admit an external nestable review skill, the
# panel pass runs as a separate tower-level step per unit, not through this knob.
#
# The by-layer contrast matters if you are tempted to try it locally instead: a
# malformed review_sequence in the ADOPTER or MACHINE-LOCAL layer warn+degrades
# (exit 0) to the CORE DEFAULT — today [polish] — not to the value pinned here.
# So a machine-local [self-review, panel-review] discards this repo's own policy
# and converges through /polish instead. That degrade is loud, not silent (the
# resolver names the offending layer and the fallback on stderr), but it exits 0,
# so nothing downstream refuses to proceed. Both resolvers degrade to the core
# default rather than the next-lower layer because config-get exposes only the
# merged winning value; see the by-layer policy comments in
# scripts/resolve-review-sequence.sh and scripts/resolve-dispatch-isolation.sh.
review_sequence: [self-review]

# Pinned, not inherited: the review sequence above depends on it. `per-step` runs
# implementation and EACH review_sequence skill in its own fresh /resume-seeded
# session, so each review's perspective is uncontaminated by the prior step's
# context (the "clears in between" the sequence assumes). This currently matches
# the core default, but config/defaults.yml tracks flipping that default as risk
# row R3, so this repo states it explicitly rather than inheriting it.
dispatch_isolation: per-step
