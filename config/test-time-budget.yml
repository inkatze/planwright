---
# Test wall-clock budgets for `check:test-time` (scripts/check-test-time.sh).
#
# Three ceilings over the shell suite's measured times, in seconds, and the
# shard planner's settings. A measured time GREATER THAN OR EQUAL TO its
# budget trips the gate.
#
#   per_file_seconds         one ceiling for every tests/*.sh file alike
#   suite_mean_file_seconds  the mean file time over the whole suite; it does
#                            not grow with the file count, so adding files is
#                            free and only a suite slower per file trips it
#   shard_wall_seconds       the slowest Linux shard's wall-clock in a sharded
#                            run (the macOS and Alpine shards `check` also
#                            waits on report to no gate); a lone shard report
#                            (one planned shard) is judged on it, an
#                            unsharded run is not
#   shard_target_seconds     what scripts/run-tests.sh --plan-shards aims each
#                            shard at: CI runs as many shards as the predicted
#                            suite time needs to stay at or under it; the gate
#                            requires it under shard_wall_seconds
#   shard_count_max          the planner's cap on the shard count
#   untimed_warn_percent     warn (never fail) when more than this share of
#                            the suite has no row in config/test-durations.tsv
#
# CI hard-fails, local warns. The budgets are measured on the reference runner
# (GitHub Actions, under the parallel runner), so an overrun there fails the
# gate. On a dev box the same overrun only warns loudly: core count,
# contention, and platform cost differ from the runner by more than any
# headroom covers, so local numbers are not the baseline and are never what a
# budget is set from.
#
# Bump consciously. A budget is raised only as a deliberate, reviewed edit in
# the PR that needs it — never silently, never to make a red run green. Split
# or slim the offending file first; if the cost is real, raise the budget and
# record the new measured baseline and the headroom below, so the next reader
# sees why the number is what it is. The 30–50% headroom covers runner noise
# only, not growth: a file, or the suite per file, getting slower is exactly
# what this file exists to make visible. More files is not that growth; the
# planner absorbs it in the shard count.
#
# Derivation (2026-09-03, PROVISIONAL): set generously for the calibration
# run of the PR that introduces this gate. The pre-gate baseline is the
# reference-runner measurement recorded in the Task 6 PR (serial best-of-3,
# slowest file 40.988s, serial sum 343.396s), which is a different scheduling
# context from the parallel gated run and so bounds the gate's numbers from
# below only. The first CI-mode run of this gate prints the in-context
# baseline; these values are replaced from it, plus headroom, in the same PR.
#
# Suite total raised 2026-10-02, when every repo-side config lookup began
# validating a pinned repository root. Reference-runner wall-clocks: main
# 548.5s (252 files); the branch that added the validation 600.7s and, on a
# slower runner the same day, 666.3s (254 files), with files that branch did
# not touch slower by a similar share, so runner variance is near 10%. 780s
# is the quieter 600.7s plus 30% headroom.
#
# Suite total raised 2026-10-13 for runner variance alone. On one branch
# (306 files) the reference runner measured 540s to 800s across six heads,
# and two heads with identical test code ran 679s and 800s; main measured
# 763s the same day. Variance is near 50%, past the 30% the old headroom
# assumed, so 780s failed green code. 1000s is the slowest of those runs,
# 800s, plus 25%.
#
# Both suite budgets re-derived 2026-10-20 from the first green sharded runs
# (three, one of them on main). The shards' summed wall-clocks measured
# 686s to 806s, in line with the unsharded runs above, so the suite total
# stays 1000s, the slowest sum plus 24%. The slowest shard measured 286s to
# 292s, while single shards ranged from 190s to 292s across those runs, a
# spread near 1.5x. Part of it was the duration table of the time giving one
# shard more work, since evened by regenerating the table; the rest is that
# one shard job has run uniformly slower than its siblings even after the
# split changed, which a single runner does not average out. 400s is the
# slowest shard plus 37%.
#
# Suite total raised 2026-10-31 for growth the gate made visible. Across
# eleven main runs from 2026-10-27 to 2026-10-31 (389 to 412 files) the
# shards' summed wall-clocks measured 675s to 1075s, climbing with the file
# count, and two of those runs failed at 1036s and 1075s on code that passed
# every test; two pull-request runs the same day measured 1001s and 1002s.
# 1400s is the slowest, 1075s, plus 30%. The slowest shard measured 262s to
# 383s over the same runs, still under its 400s budget, which stays.
# Suite total replaced 2026-10-31 by the mean per file, with the shard count
# now planned from the predicted suite time. A summed wall-clock grows with
# the file count by construction, so it tripped on growth alone (raised
# 2026-10-02, 2026-10-13 and 2026-10-31). Across the fifteen main runs from
# 2026-10-20 to 2026-10-31 whose shard jobs all passed (382 to 412 files),
# the mean file time measured 6.88s to 10.40s. 13.5s is the slowest plus 30%.
#
# Shard target set 2026-10-31. The planner predicts the suite from the
# duration table (refreshed the same day as the median of five such runs) and
# splits it so each shard's predicted wall-clock is at most the target. Over
# those fifteen runs a run's total file time came to as much as 1.11x the
# table's prediction, and the slowest shard ran up to 1.44x the mean shard
# (1.21x or less in all but one run), so a 200s target puts the slowest shard
# near 200s x 1.11 x 1.44 = 320s in the worst case seen, under the 400s
# per-shard budget, which stays. At the day's prediction (3878s on four
# cores) that is five shards. Ten shards caps the cost: each adds a runner's
# setup, about a minute, and the cap is about twice the day's suite, past
# which the per-shard budget makes the growth visible again.
per_file_seconds: 120
suite_mean_file_seconds: 13.5
shard_wall_seconds: 400
shard_target_seconds: 200
shard_count_max: 10
untimed_warn_percent: 5
